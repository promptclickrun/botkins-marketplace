name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
      - run: node --test "test/*.test.mjs"
      - name: Hevy tools match the live OpenAPI spec
        if: github.event_name != 'pull_request'
        run: |
          node scripts/gen-hevy-tools.mjs
          git diff --exit-code plugins/hevy/tools.json || { echo "::error::Hevy API changed. Run node scripts/gen-hevy-tools.mjs and commit."; exit 1; }
